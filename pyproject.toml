[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tdma-schedule-optimizer"
version = "1.0.0"
description = "TDMA Schedule Planner and Optimizer for Wireless Networks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["tdma", "wireless", "scheduling", "graph-coloring", "dsatur"]
dependencies = [
    "networkx>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
tdma-optimizer = "tdma_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/tdma_optimizer"]
